<html lang="es">

    <meta property="og:description" content="Invierte en activos tokenizados con Investoken" />
    <meta property="og:url" content="https://investoken.com" />

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.example.com" />

    <meta http-equiv="x-ua-compatible" content="IE=edge" />
    <link rel="prefetch" href="/src/main.tsx" />

    <title>Investoken</title>

    <!-- Styles will be injected here by Vite -->
  </head>
  <body style="margin: 0; padding: 0; background-color: #0a0e27; overflow-x: hidden;">
    <div id="root" class="h-screen min-h-screen flex flex-col"></div>
    <noscript>
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #0a0e27; color: white; font-family: system-ui, -apple-system, sans-serif; text-align: center;">
        <div>
          <h1>JavaScript Requerido</h1>
          <p>Esta aplicación requiere JavaScript habilitado para funcionar correctamente.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(registration => console.log('SW Registered:', registration))
            .catch(error => console.log('SW Registration failed:', error));
        });
      }
    </script>
  </body>
